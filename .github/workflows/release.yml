name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: scrauper

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  create-tag:
    name: Create Tag
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases must be created from the main branch"
            exit 1
          fi

      - name: Read current version
        id: current
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.current.outputs.version }}"
          case "${{ inputs.version_bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="${major}.${minor}.${patch}"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"
          echo "Bumping ${{ steps.current.outputs.version }} -> $new_version"

      - name: Update Cargo.toml
        run: sed -i "s/^version = \".*\"/version = \"${{ steps.bump.outputs.new_version }}\"/" Cargo.toml

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin main --tags

  build:
    name: Build (${{ matrix.name }})
    needs: create-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - name: android-arm64
            target: aarch64-linux-android
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - name: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-${{ matrix.name }}.tar.gz ${{ env.BINARY_NAME }}
          cd ../../..

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe -DestinationPath ${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.name }}
          path: ${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-${{ matrix.name }}.*

  release:
    name: Create Release
    needs: [create-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.tag }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configurationJson: |
            {
              "categories": [
                { "title": "## What's Changed", "labels": [] }
              ],
              "template": "#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-tag.outputs.tag }}
          name: ${{ needs.create-tag.outputs.tag }}
          body: |
            ## Installation

            | Platform | Download |
            |----------|----------|
            | Linux x64 | [`${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-linux-x64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.create-tag.outputs.tag }}/${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-linux-x64.tar.gz) |
            | Linux ARM64 | [`${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-linux-arm64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.create-tag.outputs.tag }}/${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-linux-arm64.tar.gz) |
            | Android ARM64 | [`${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-android-arm64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.create-tag.outputs.tag }}/${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-android-arm64.tar.gz) |
            | macOS ARM64 | [`${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-macos-arm64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ needs.create-tag.outputs.tag }}/${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-macos-arm64.tar.gz) |
            | Windows x64 | [`${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ needs.create-tag.outputs.tag }}/${{ env.BINARY_NAME }}-${{ needs.create-tag.outputs.tag }}-windows-x64.zip) |

            ${{ steps.changelog.outputs.changelog }}
          files: ${{ env.BINARY_NAME }}-*

  cleanup:
    name: Cleanup on Failure
    needs: [create-tag, build, release]
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Delete tag and revert version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Delete remote tag if it exists
          git push origin --delete "${{ needs.create-tag.outputs.tag }}" || true

          # Revert the version bump commit on main
          git checkout main
          git pull origin main
          if git log -1 --pretty=%s | grep -q "chore: bump version"; then
            git revert --no-edit HEAD
            git push origin main
          fi
