[package]
name = "scrauper"
version = "0.1.0"
edition = "2021"
description = "Multi-threaded ScreenScraper API scraper for ES-DE"
license = "MIT"
repository = "https://github.com/nikuscs/scrauper"
readme = "README.md"
keywords = ["screenscraper", "es-de", "emulation", "scraper", "rom"]
categories = ["command-line-utilities"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client (pure Rust TLS, no OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# XML (gamelist.xml)
quick-xml = { version = "0.37", features = ["serialize"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Hashing (ROM identification)
crc32fast = "1"
md-5 = "0.10"
sha1 = "0.10"
digest = "0.10"

# Image processing (miximage - pure Rust)
image = "0.25"
imageproc = "0.25"

# Progress bars
indicatif = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Rate limiting
governor = "0.8"

# File system
walkdir = "2"
globset = "0.4"

# URL encoding
urlencoding = "2"

# Date handling
chrono = { version = "0.4", features = ["serde"] }

# Platform paths
dirs = "6"

# Futures/streams
futures = "0.3"

# Fuzzy string matching
strsim = "0.11"

# Interactive prompts
dialoguer = "0.11"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
future_not_send = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
format_push_string = "allow"
return_self_not_must_use = "allow"
unnecessary_debug_formatting = "allow"
use_self = "allow"
many_single_char_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
doc_markdown = "allow"
trivially_copy_pass_by_ref = "allow"
missing_const_for_fn = "allow"
cognitive_complexity = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
uninlined_format_args = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
