# Cross-compilation settings for scrauper
# These are used when building with `cross` or native cross-compilation toolchains.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"

[target.x86_64-unknown-linux-gnu]
# Native on most Linux systems, no special linker needed

[target.x86_64-pc-windows-msvc]
# Native on Windows, no special linker needed

[target.aarch64-apple-darwin]
# Native on Apple Silicon, no special linker needed
